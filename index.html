<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jabri Android الجبري أندرويد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      font-size: 36px;
      color: #00ff88;
      margin-bottom: 10px;
      text-shadow: 0 0 15px #00ff88;
    }
   .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 40px;
    }
   .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
   .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 25px;
      transition: 0.3s;
      cursor: pointer;
    }
   .card:hover {
      border-color: #00ff88;
      transform: translateY(-5px);
      box-shadow: 0 5px 20px rgba(0, 255, 136, 0.2);
    }
   .card h3 {
      color: #00ff88;
      margin-bottom: 10px;
      font-size: 20px;
    }
   .card p {
      color: #aaa;
      font-size: 14px;
    }
   .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
   .modal.active { display: flex; }
   .modal-content {
      background: #1a1a1a;
      padding: 30px;
      border-radius: 12px;
      border: 1px solid #00ff88;
      max-width: 500px;
      text-align: center;
    }
   .modal-content h2 { color: #00ff88; margin-bottom: 15px; }
   .modal-content p { color: #aaa; margin-bottom: 20px; line-height: 1.6; }
   .btn {
      display: inline-block;
      padding: 12px 30px;
      background: #00ff88;
      color: #0a0a0a;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      margin: 5px;
    }
   .btn-close {
      background: #333;
      color: #fff;
    }
  </style>
</head>
<body>
  <h1>♻️ Jabri Site الجبري أندرويد</h1>
  <p class="subtitle">مركز المشاريع على GitHub - اضغط على أي مشروع</p>

  <div class="grid" id="projects"></div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
      <a id="modal-link" class="btn" target="_blank">فتح المشروع</a>
      <button class="btn btn-close" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <script>
    const projects = [
      {
        name: "Zx_Mother_Function_Jabri",
        desc: "المشروع الرئيسي لمكتبة الدوال والوظائف الخاصة بـ Jabri Android",
        link: "https://github.com/Jabri-web/Zx_Mother_Function_Jabri"
      },
      {
        name: "Android11RomPorting",
        desc: "بورت رومات أندرويد 11 للأجهزة المختلفة",
        link: "https://github.com/Jabri-web/Android11RomPorting"
      },
      {
        name: "RR-Official-devices",
        desc: "أجهزة رسمية مدعومة لـ Resurrection Remix",
        link: "https://github.com/Jabri-web/RR-Official-devices"
      },
      {
        name: "ApkTool",
        desc: "أداة تعديل ملفات APK وتفكيكها وإعادة بنائها",
        link: "https://github.com/Jabri-web/ApkTool"
      },
      {
        name: "Hanadroid-android11",
        desc: "مشروع أندرويد 11 مخصص",
        link: "https://github.com/Jabri-web/Hanadroid-android11"
      },
      {
        name: "jabri-android",
        desc: "مشروع الجبري أندرويد الرئيسي",
        link: "https://github.com/Jabri-web/jabri-android"
      }
    ];

    const grid = document.getElementById('projects');

    projects.forEach((proj, i) => {
      grid.innerHTML += `
        <div class="card" onclick="openModal(${i})">
          <h3>${proj.name}</h3>
          <p>${proj.desc}</p>
        </div>
      `;
    });

    function openModal(i) {
      document.getElementById('modal-title').textContent = projects[i].name;
      document.getElementById('modal-desc').textContent = projects[i].desc;
      document.getElementById('modal-link').href = projects[i].link;
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    document.getElementById('modal').addEventListener('click', (e) => {
      if(e.target.id === 'modal') closeModal();
    });
  </script>
</body>
</html>
