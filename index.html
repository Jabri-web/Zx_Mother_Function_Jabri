<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الجبري أندرويد</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #0a0a0a;
      color: #fff;
      padding: 40px 20px;
    }
    h1 {
      text-align: center;
      font-size: 36px;
      color: #00ff88;
      margin-bottom: 10px;
      text-shadow: 0 0 15px #00ff88;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 40px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 25px;
      transition: 0.3s;
      text-decoration: none;
      color: #fff;
      display: block;
    }
    .card:hover {
      border-color: #00ff88;
      transform: translateY(-5px);
      box-shadow: 0 5px 20px rgba(0, 255, 136, 0.2);
    }
    .card h3 {
      color: #00ff88;
      margin-bottom: 10px;
      font-size: 20px;
    }
    .card p {
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🔥 الجبري أندرويد</h1>
  <p class="subtitle">مركز مشاريعي على GitHub</p>
  
  <div class="grid">
    <a href="https://jabri-web.github.io/Zx_Mother_Function_Jabri/" class="card">
      <h3>Zx_Mother_Function_Jabri</h3>
      <p>المشروع الرئيسي</p>
    </a>
    
    <a href="https://github.com/Jabri-web/Android11RomPorting" class="card">
      <h3>Android11RomPorting</h3>
      <p>بورت رومات أندرويد 11</p>
    </a>
    
    <a href="https://github.com/Jabri-web/RR-Official-devices" class="card">
      <h3>RR-Official-devices</h3>
      <p>أجهزة رسمية لـ Resurrection Remix</p>
    </a>
    
    <a href="https://github.com/Jabri-web/ApkTool" class="card">
      <h3>ApkTool</h3>
      <p>أداة تعديل ملفات APK</p>
    </a>
    
    <a href="https://github.com/Jabri-web/Hanadroid-android11" class="card">
      <h3>Hanadroid-android11</h3>
      <p>مشروع هانادرويد</p>
    </a>
    
    <a href="https://github.com/Jabri-web/jabri-android" class="card">
      <h3>jabri-android</h3>
      <p>مشروع الجبري أندرويد</p>
    </a>
  </div>
</body>
</html>
